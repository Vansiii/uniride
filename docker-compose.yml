# Entorno local de UniRide (AGENTS.md §9.4): PostgreSQL, MinIO (S3 local), nodo Hardhat y la API.
# Uso: copiar .env.example a .env, completar las contraseñas y ejecutar `docker compose up --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uniride}
      POSTGRES_USER: ${POSTGRES_USER:-uniride_migraciones}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD en .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Definir POSTGRES_APP_PASSWORD en .env}
    ports: ["${POSTGRES_PUERTO:-5432}:5432"]
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  minio:
    # minio/minio ya no se publica en Docker Hub (27/10/2026): imagen de Bitnami, solo para desarrollo.
    image: bitnamilegacy/minio:2025.5.24-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Definir MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Definir MINIO_ROOT_PASSWORD en .env}
    ports: ["9000:9000", "9001:9001"]
    volumes: [datos_minio:/bitnami/minio/data]

  hardhat:
    build: ./contracts
    ports: ["8545:8545"]

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      S3_ENDPOINT: http://minio:9000
      # MinIO local no tiene KMS (HU-11).
      S3_CIFRADO: ninguno
      CADENA_RPC_URL: http://hardhat:8545
    ports: ["3000:3000"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  datos_postgres:
  datos_minio:
